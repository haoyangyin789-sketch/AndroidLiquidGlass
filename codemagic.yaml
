# codemagic.yaml - 用于编译 AndroidLiquidGlass 项目
workflows:
  android-build:
    name: Android Debug APK Build
    max_build_duration: 30
    environment:
      java: "11"
    scripts:
      - name: Checkout code
        script: |
          git clone https://github.com/haoyangin789-sketch/AndroidLiquidGlass.git .
      - name: Set up Gradle
        script: |
          chmod +x gradlew
      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/**/*.apk
